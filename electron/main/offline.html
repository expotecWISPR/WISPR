<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>WISPR · sin conexión</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, "Segoe UI", sans-serif; color: #f5f5f5;
      background: radial-gradient(circle at 50% 0%, #0f2c67, #081a3a 70%);
    }
    .card {
      max-width: 440px; margin: 16px; padding: 28px; border-radius: 14px; text-align: center;
      border: 1px solid rgba(243, 149, 13, 0.35); background: rgba(4, 18, 43, 0.75);
      box-shadow: 0 0 40px rgba(243, 149, 13, 0.12);
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { color: #b5c0d4; line-height: 1.5; }
    code { color: #f3950d; word-break: break-all; }
    a {
      display: inline-block; margin-top: 12px; padding: 10px 22px; border-radius: 10px;
      background: #f3950d; color: #081a3a; font-weight: 700; text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📡 No se pudo conectar con WISPR</h1>
    <p>El servidor no responde en <code id="url">—</code>.<br>Revisa tu conexión o que el servidor esté encendido.</p>
    <a id="retry" href="#">Reintentar</a>
  </main>
  <script>
    // La dirección llega como parámetro ?url= desde main/index.js.
    const target = new URLSearchParams(location.search).get("url") || "";
    document.getElementById("url").textContent = target || "(sin dirección)";
    if (/^https?:\/\//.test(target)) document.getElementById("retry").href = target;
  </script>
</body>
</html>
