# Configuración de Alembic (la herramienta que gestiona los cambios en la
# base de datos a lo largo del tiempo).
#
# OJO: acá abajo NO va la URL real de la base de datos (sqlalchemy.url
# queda vacío a propósito). env.py la toma de app.core.config.settings,
# que a su vez la lee del .env. Así nunca queda una contraseña real
# guardada en un archivo que se sube a Git.

[alembic]
# %(here)s = la carpeta donde vive este mismo archivo (backend/migrations).
# env.py, script.py.mako y la carpeta versions/ están todos ahí mismo.
script_location = %(here)s

# Agrega backend/ al principio de las rutas de búsqueda de Python, para que
# env.py pueda hacer "from app.core.config import settings" sin problema,
# sin importar desde qué carpeta se ejecute el comando "alembic".
prepend_sys_path = %(here)s/..

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
