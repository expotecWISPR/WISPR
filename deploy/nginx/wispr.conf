# nginx de WISPR en la instancia EC2 (una sola máquina, ver docs/arquitectura_mvp.md → CONFIG AWS).
#
#   navegador ──> nginx :80/:443 ──┬─> FastAPI 127.0.0.1:8000   cuentas, retos, flags, ranking (Supabase)
#                                  └─> Node    127.0.0.1:8787   frontend + terminal Kali (Docker)
#
# Node corre `wispr_terminal_professional/server.js` en "modo conectado"
# (WISPR_BACKEND_URL=http://127.0.0.1:8000): valida cada token preguntándole a
# FastAPI y le reenvía las flags de `ctf submit`. Las rutas que van a Node son
# las mismas de TERMINAL_API en server.js; si se agrega una allá, agregarla acá.
#
# Instalar: copiar a /etc/nginx/conf.d/wispr.conf, cambiar server_name,
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d <dominio>  (agrega el bloque 443 a este archivo).
# Después de tener HTTPS, descomentar la línea de HSTS.

upstream wispr_api      { server 127.0.0.1:8000; }
upstream wispr_terminal { server 127.0.0.1:8787; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name wispr.ejemplo.com;   # <- dominio o IP pública; la misma va en WISPR_PUBLIC_HOSTS de Node

    server_tokens off;               # no anunciar la versión de nginx
    client_max_body_size 256k;       # la API solo recibe JSON pequeños
    # add_header Strict-Transport-Security "max-age=31536000" always;   # solo con HTTPS

    # La IP real del estudiante. Se REEMPLAZA (no se agrega) X-Forwarded-For:
    # así un cliente no puede inventarse otra IP para saltarse el límite de
    # peticiones de FastAPI.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1) Terminal Kali (WebSocket) -> Node
    location = /ws/terminal {
        proxy_pass http://wispr_terminal;
        proxy_http_version 1.1;
        # Una location con proxy_set_header propio NO hereda los de arriba:
        # hay que repetirlos.
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      $connection_upgrade;
        proxy_read_timeout 1h;           # una terminal puede pasar mucho rato sin tráfico
        proxy_send_timeout 1h;
        # El navegador manda el token de sesión en la URL (?token=...): un
        # WebSocket no admite cabeceras. Sin esto quedaría escrito en el log.
        access_log off;
    }

    # 2) Rutas de la terminal -> Node
    location /api/kali/ {
        proxy_pass http://wispr_terminal;
        proxy_read_timeout 120s;         # arrancar o detener el contenedor tarda
    }
    location = /api/challenges/active {
        proxy_pass http://wispr_terminal;
        proxy_read_timeout 120s;
    }
    location = /api/platform/status {
        proxy_pass http://wispr_terminal; # Node es quien sabe si Docker está listo
    }

    # 3) Todo el resto de la API -> FastAPI
    location /api/ {
        proxy_pass http://wispr_api;
    }

    # 4) Frontend (index.html, app.js, estilos, xterm) -> Node
    location / {
        proxy_pass http://wispr_terminal;
    }
}
